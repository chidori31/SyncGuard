name: SyncGuard verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syncguard
          POSTGRES_PASSWORD: syncguard_local_demo
          POSTGRES_DB: syncguard
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U syncguard"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://syncguard:syncguard_local_demo@127.0.0.1:55432/syncguard?connect_timeout=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_secrets.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --cov=app --cov-fail-under=90
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  http-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx==0.28.1'
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python tools/verify_stack.py
      - if: always()
        run: docker compose down
  source-release:
    needs: [verify, http-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/build_release.py --output "$RUNNER_TEMP/SyncGuard-source.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: SyncGuard-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SyncGuard-source.zip
            ${{ runner.temp }}/SyncGuard-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
