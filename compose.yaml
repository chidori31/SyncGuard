name: syncguard
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncguard_local_demo}
      POSTGRES_DB: ${POSTGRES_DB:-syncguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syncguard}:${POSTGRES_PASSWORD:-syncguard_local_demo}@postgres:5432/${POSTGRES_DB:-syncguard}
      SIMULATOR_URL: http://simulator:8100
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
  simulator:
    build: ./backend
    command: ["uvicorn", "app.simulator:app", "--host", "0.0.0.0", "--port", "8100", "--no-access-log"]
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
