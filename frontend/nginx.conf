server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 30s; }
    location = /health { proxy_pass http://backend:8000/health; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }
    location / { try_files $uri $uri/ /index.html; }
}
